<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Character Effect Studio</title><link rel='stylesheet' href='style.css'></head><body><header><div><small>MOTION GRAPHICS TOOL</small><h1>Character Effect Studio</h1></div><span>● Browser render</span></header><main><aside><section><h2>1. Add characters</h2><label class='drop'><input id='files' type='file' accept='image/*' multiple><b>Drop character cut-outs</b><small>PNG recommended</small></label><div id='thumbs'></div></section><section><h2>2. Scene settings</h2><label>Title<input id='title' value='CHARACTER NAME'></label><label>Subtitle<input id='sub' value='CHAMPION • 2026'></label><div class='grid'><label>Duration<input id='duration' type='number' min='2' max='30' value='8'></label><label>FPS<select id='fps'><option>30</option><option selected>60</option></select></label><label>Canvas<select id='ratio'><option>16:9</option><option>9:16</option><option>1:1</option></select></label><label>Motion<select id='motion'><option>zigzag</option><option>push</option><option>parallax</option></select></label></div><button id='preview'>▶ Preview</button><button id='render'>● Render & Download</button><p id='msg'>Add images, then preview or render.</p></section></aside><section class='stage'><div>LIVE CANVAS <span id='time'>00:00 / 00:08</span></div><canvas id='c' width='960' height='540'></canvas></section></main><footer>Your images stay in your browser • GitHub Pages ready</footer><script src='script.js'></script></body></html>
