<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Effect Studio</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">MOTION GRAPHICS TOOL</div><h1>Character Effect Studio</h1></div><div class="status"><span></span> Browser render • No server upload</div></header><main class="app"><section class="controls"><div class="panel"><h2>1. Add characters</h2><label class="drop"><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><strong>Drop character cut-outs</strong><small>PNG recommended • multiple files supported</small></label><div id="thumbs" class="thumbs"></div></div><div class="panel"><h2>2. Scene settings</h2><label>Title<input id="title" value="CHARACTER NAME"></label><label>Subtitle<input id="subtitle" value="CHAMPION • 2026"></label><div class="grid"><label>Duration<input id="duration" type="number" min="2" max="30" step=".5" value="8"> sec</label><label>FPS<select id="fps"><option>30</option><option selected>60</option></select></label><label>Canvas<select id="ratio"><option value="16:9" selected>16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select></label><label>Motion<select id="motion"><option value="zigzag" selected>Cinematic zig-zag</option><option value="push">Push / slide</option><option value="parallax">Parallax</option></select></label></div><button id="preview" class="primary">▶ Preview animation</button><button id="render" class="secondary">● Render & Download WebM</button><div id="msg" class="msg">Add images, then preview or render.</div></div></section><section class="stageWrap"><div class="stageHead"><span>LIVE CANVAS</span><span id="time">00:00 / 00:08</span></div><canvas id="canvas" width="960" height="540"></canvas></section></main><footer>Character Effect Studio • Built for GitHub Pages • Your files stay in your browser</footer><script src="script.js"></script></body></html>
