<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Effect Studio</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div><div class="eyebrow">MOTION GRAPHICS TOOL</div><h1>Character Effect Studio</h1></div><div class="status"><span></span>Browser render • v2</div></header>
<main class="app">
<aside class="controls">
<section class="panel"><h2>01 / CHARACTERS</h2><label class="drop" id="drop"><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><strong>＋ Drop character cut-outs</strong><small>PNG with transparency recommended • up to 20</small></label><div id="thumbs" class="thumbs"></div></section>
<section class="panel"><h2>02 / TEXT & SCENE</h2><label>Title<input id="title" value="CHARACTER NAME" maxlength="34"></label><label>Subtitle<input id="sub" value="CHAMPION • 2026" maxlength="44"></label><div class="grid"><label>Duration<input id="duration" type="number" min="2" max="30" value="8"></label><label>FPS<select id="fps"><option>30</option><option selected>60</option></select></label><label>Canvas<select id="ratio"><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select></label><label>Motion<select id="motion"><option value="zigzag">Zig-zag</option><option value="push">Push</option><option value="parallax">Parallax</option></select></label></div><label class="check"><input id="mono" type="checkbox" checked> Cinematic monochrome</label><button id="preview" class="secondary">▶ Preview</button><button id="render" class="primary">● Render & Download</button><p id="msg" class="msg">Add character cut-outs to begin.</p></section>
</aside>
<section class="stageWrap"><div class="stageHead"><span>LIVE CANVAS</span><span id="time">00:00 / 00:08</span></div><div class="stage"><canvas id="c" width="960" height="540"></canvas><div class="scan"></div></div><div class="tips">Tip: use transparent PNGs for clean character silhouettes and stronger depth.</div></section>
</main><footer>Your images stay in your browser • GitHub Pages ready</footer><script src="script.js"></script></body></html>
